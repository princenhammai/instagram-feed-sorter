name: Release ZIP
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.3.2'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mcp
      - run: npm run package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Publish extension ZIP and checksum
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --title "Instagram Feed Sorter $RELEASE_TAG" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
